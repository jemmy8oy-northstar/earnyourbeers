# Set this to your app name at scaffold time (e.g. "macro-metrics")
fullnameOverride: "earnyourbeers"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: balenthiran.co.uk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    - hosts:
        - balenthiran.co.uk
      secretName: balenthiran-tls # shared wildcard cert — no per-project TLS setup
registryPrefix: "lhr.ocir.io/lr7uc6l49odc" # shared OCIR namespace
apps:
  - name: backend
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/earnyourbeers-backend # Update at scaffold time
      tag: 0.2.5
      pullPolicy: Always
    containerPort: 8080
    replicas: 1
    service:
      port: 80
      targetPort: 8080
    ingress:
      path: /earnyourbeers/api # developer replaces 'earnyourbeers' at scaffold time
      pathType: Prefix
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    env:
      # The ingress routes /earnyourbeers/api here without stripping the prefix.
      - name: PathBase
        value: "/earnyourbeers" # developer replaces 'earnyourbeers' at scaffold time
      - name: ASPNETCORE_ENVIRONMENT
        value: "Production"
      # Created by secret-provisioner from oke-fleet secrets/earnyourbeers.json.
      - name: ConnectionStrings__DefaultConnection
        valueFrom:
          secretKeyRef:
            name: earnyourbeers-secrets
            key: ConnectionStrings__DefaultConnection
  - name: frontend
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/earnyourbeers-frontend # Update at scaffold time
      tag: 0.2.5
      pullPolicy: Always
    containerPort: 80
    replicas: 1
    service:
      port: 80
      targetPort: 80
    ingress:
      path: /earnyourbeers # developer replaces 'earnyourbeers' at scaffold time
      pathType: Prefix
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
# App-specific secrets — add per project (none pre-scaffolded):
